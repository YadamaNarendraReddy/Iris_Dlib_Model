<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 150" role="img" aria-labelledby="title desc">
  <title id="title">Iris assistant processing pipeline</title>
  <desc id="desc">Speech and face recognition feed a context prompt, authorization check, response generator, and device action.</desc>
  <rect width="1120" height="150" fill="#fffdf8"/>
  <path d="M22 118H1098" stroke="#d9d2c5" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#151a20">
    <g transform="translate(34 26)">
      <rect width="134" height="76" rx="6" fill="#f6f1e8" stroke="#d9d2c5"/>
      <circle cx="28" cy="38" r="16" fill="#176b87"/>
      <path d="M24 38h8M28 34v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="54" y="34" font-weight="700">Speech</text>
      <text x="54" y="55" fill="#667085">transcript</text>
    </g>
    <g transform="translate(192 26)">
      <rect width="134" height="76" rx="6" fill="#f6f1e8" stroke="#d9d2c5"/>
      <circle cx="28" cy="38" r="16" fill="#c47f2c"/>
      <path d="M20 40c4-10 12-10 16 0M21 46h14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="54" y="34" font-weight="700">Face</text>
      <text x="54" y="55" fill="#667085">identity</text>
    </g>
    <path d="M169 64h18M327 64h30" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(360 18)">
      <rect width="172" height="92" rx="6" fill="#101820"/>
      <text x="18" y="34" fill="#ffffff" font-weight="700">Iris Engine</text>
      <text x="18" y="58" fill="#aeb7c2">merge context</text>
      <text x="18" y="80" fill="#aeb7c2">extract intent</text>
    </g>
    <path d="M533 64h34" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(572 26)">
      <rect width="142" height="76" rx="6" fill="#f6f1e8" stroke="#d9d2c5"/>
      <text x="18" y="34" font-weight="700">Auth check</text>
      <text x="18" y="55" fill="#667085">allow or block</text>
    </g>
    <path d="M715 64h34" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(754 26)">
      <rect width="142" height="76" rx="6" fill="#f6f1e8" stroke="#d9d2c5"/>
      <text x="18" y="34" font-weight="700">GPT engine</text>
      <text x="18" y="55" fill="#667085">response text</text>
    </g>
    <path d="M897 64h34" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(936 26)">
      <rect width="150" height="76" rx="6" fill="#f6f1e8" stroke="#d9d2c5"/>
      <text x="18" y="34" font-weight="700">TTS + device</text>
      <text x="18" y="55" fill="#667085">speak and act</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#667085"/>
    </marker>
  </defs>
</svg>
